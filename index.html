<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Ren Sayang 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: white;
}

.card {
  background: rgba(255,255,255,0.25);
  padding: 28px;
  border-radius: 22px;
  text-align: center;
  width: 90%;
  max-width: 420px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  animation: fadeIn 1.2s ease;
  z-index: 10;
}

h1 {
  font-size: 2.1em;
  margin-bottom: 10px;
}

p {
  font-size: 1.1em;
  min-height: 100px;
  line-height: 1.5;
}

button {
  margin-top: 20px;
  padding: 14px 32px;
  border: none;
  border-radius: 30px;
  background: white;
  color: #ff4d6d;
  font-weight: bold;
  font-size: 1em;
  cursor: pointer;
}

button:hover {
  transform: scale(1.05);
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1); }
}

/* BALON */
.balloon {
  position: absolute;
  bottom: -120px;
  width: 50px;
  height: 70px;
  border-radius: 50%;
  animation: float 8s linear infinite;
}

.balloon::after {
  content: '';
  position: absolute;
  width: 2px;
  height: 40px;
  background: white;
  left: 50%;
  top: 70px;
}

@keyframes float {
  from { transform: translateY(0); }
  to { transform: translateY(-130vh); }
}
</style>
</head>

<body>

<!-- MUSIK -->
<audio id="music" src="music.mp3" loop></audio>

<div class="card">
  <h1>Hai Ren Sayang 👀🎂</h1>
  <p id="text">Ada yang ulang tahun hari ini yaaa 😏🎁</p>
  <button onclick="next()">Klik aku 🤍</button>
</div>

<script>
const music = document.getElementById("music");
const textEl = document.getElementById("text");

const messages = [
  "Selamat ulang tahun sayangku, cintaku, duniaku 😗🥰🫶🌎",
  "Semoga dengan bertambahnya umur kamu bisa menjadi pribadi yang lebih baik lagi 🤍",
  "Semoga kamu selalu sehat, baik mental maupun fisiknya ✨",
  "Dilancarkan rezekinya, dipermudah segala urusannya 🤲",
  "Semoga tujuan kita berdua cepat tercapai, aamiin 🤍",
  "Terima kasih sudah memberiku cinta yang belum pernah aku temui sebelumnya 💗",
  "Tetaplah menjadi laki-laki yang tidak pernah berubah dari awal hingga akhir 🥹",
  "Semangat terus dalam prosesnya gantengku 💪✨",
  "Ingat ya, menyerah bukanlah solusi ketika kamu merasa lelah 🤍",
  "Tetap jadi orang baik meskipun orang lain belum tentu memandang kita baik 🫶",
  "Aku akan selalu di sini, mendoakan dan mendukung setiap usaha kamu 🤍",
  "Ingat selalu kata-kata aku yaa, jangan melakukan hal aneh meskipun aku jauh 😅",

  /* ===== PENUTUP DALAM & SERIUS ===== */
  "Ren sayang, di hari bertambahnya usiamu ini aku tidak meminta apa-apa selain kesehatan dan ketenangan hatimu 🤍",
  "Aku tahu perjalanan hidup tidak selalu mudah, tapi percayalah kamu tidak pernah benar-benar sendiri",
  "Jika suatu hari kamu lelah atau ragu, ingat bahwa ada aku yang selalu percaya padamu",
  "Aku menerima kamu apa adanya, dengan segala proses dan perjuanganmu",
  "Semoga langkahmu selalu diberi arah yang baik dan niatmu dimudahkan oleh Tuhan",
  "Terima kasih karena sudah bertahan sejauh ini",
  "Selamat ulang tahun Ren sayang 🤍 Aku bangga padamu"
];

let index = 0;
let isTyping = false;

function typeText(text, callback) {
  let i = 0;
  textEl.innerText = "";
  isTyping = true;

  const typing = setInterval(() => {
    textEl.innerText += text.charAt(i);
    i++;
    if (i >= text.length) {
      clearInterval(typing);
      isTyping = false;
      if (callback) callback();
    }
  }, 35);
}

function next() {
  if (music.paused) music.play();
  if (isTyping) return;

  if (index < messages.length) {
    typeText(messages[index]);
    index++;
  } else {
    typeText("🎉🤍 Aku selalu mendoakanmu 🤍🎉", spawnBalloons);
  }
}

function spawnBalloons() {
  const colors = ["#ff4d6d","#ffd166","#06d6a0","#4cc9f0","#c77dff"];
  for (let j = 0; j < 30; j++) {
    const b = document.createElement("div");
    b.className = "balloon";
    b.style.left = Math.random() * 100 + "vw";
    b.style.background = colors[Math.floor(Math.random() * colors.length)];
    b.style.animationDuration = (6 + Math.random() * 4) + "s";
    document.body.appendChild(b);
  }
}
</script>
